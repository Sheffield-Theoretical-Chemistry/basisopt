[build-system]
requires = ["setuptools>=40.6.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "basisopt"
version = "1.2.2"
license = { text = "MIT" }
description = "Automatic basis set optimization for quantum chemistry"
readme = "README.md"
authors = [
    { name = "Robert Shaw", email = "robertshaw383@gmail.com" },
    { name = "Grant Hill", email = "grant.hill@sheffield.ac.uk" },
    { name = "Shaun Donnelly", email = "s.t.donnelly@sheffield.ac.uk" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = ["quantum", "chemistry", "optimization", "basis sets"]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "colorlog>=6.7.0",
    "scipy>=1.10.1",
    "pandas>=1.5.3",
    "monty>=2022.9.9",
    "basis-set-exchange>=0.9",
    "mendeleev>=0.9",
    "matplotlib>=3.7.1",
    "ray>=2.11.0",
    "toml",
    "pyyaml>=6.0"

]

[project.urls]
Documentation = "https://basisopt.readthedocs.io/en/latest/"
Source = "https://github.com/Sheffield-Theoretical-Chemistry/basisopt"

[project.optional-dependencies]
dev = [
    "pytest>=7.2.2",
    "black>=23.1.0",
    "flake8>=6.0.0",
    "flake8-pyproject>=1.2.2",
    "pytest-cov>=4.0.0",
    "codecov>=2.1.12",
    "sphinx>=6.1.3",
    "sphinx-rtd-theme>=1.2.0",
    "isort>=5.12.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
skip-string-normalization = true
line-length = 100

[tool.flake8]
ignore = [
    "E501", "E203", "W503", "W504", "E402", "B028", "E741", "DAR402"
]
per-file-ignores = [
    "basisopt/api.py:F401"
]
max-line-length = 100
docstring_style = "google"
strictness = "long"

[tool.isort]
skip = ["__init__.py"]
